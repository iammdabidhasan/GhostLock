name: Release
on:
  push:
    tags: ["v2.1.1"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.CODESIGN_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --upgrade pyinstaller
          .\build.ps1
        shell: pwsh
      - name: Sign (optional)
        # Add secrets CODESIGN_PFX (base64 of your .pfx) and CODESIGN_PASSWORD to enable. Skipped otherwise.
        if: ${{ env.HAS_CERT == 'true' }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String("${{ secrets.CODESIGN_PFX }}"))
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign /f cert.pfx /p "${{ secrets.CODESIGN_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\GhostLock.exe dist\Setup.exe
          Remove-Item cert.pfx
        shell: pwsh
      - name: Checksums
        run: |
          Get-ChildItem dist\GhostLock.exe, dist\Setup.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File dist\SHA256SUMS.txt -Encoding ascii
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GhostLock.exe
            dist/Setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
